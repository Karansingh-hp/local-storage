
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | NovaSpace</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-card">
    <a class="brand" href="index.html">
      <span class="brand-icon">N</span> NovaSpace
    </a>

    <div class="auth-heading">
      <p class="eyebrow">GET STARTED</p>
      <h1>Create your account</h1>
      <p>Join us and make your own space.</p>
    </div>

    <form id="registerForm">
      <div class="form-group">
        <label for="fullName">Full name</label>
        <input type="text" id="fullName"
               placeholder="Enter your full name" required>
      </div>

      <div class="form-group">
        <label for="registerEmail">Email address</label>
        <input type="email" id="registerEmail"
               placeholder="you@example.com" required>
      </div>

      <div class="form-group">
        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword"
               placeholder="Create a password" minlength="6" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword"
               placeholder="Enter password again" minlength="6" required>
      </div>

      <p id="registerMessage" class="message" role="status"
         aria-live="polite"></p>

      <button type="submit" class="btn btn-primary">
        Create Account <span>→</span>
      </button>
    </form>

    <p class="auth-footer">
      Already have an account?
      <a href="index.html">Login here</a>
    </p>
  </main>
</body>
</html>
